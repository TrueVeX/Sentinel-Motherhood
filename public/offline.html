<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#123F46" />
  <title>Offline · Sentinel Motherhood</title>
  <style>
    :root { --deep: #123F46; --teal: #247C78; --mint: #A8CFC3; --ivory: #F4F7F2; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--ivory); color: var(--deep); font-family: system-ui, -apple-system, "Segoe UI", sans-serif; padding: 24px; }
    .card { max-width: 420px; text-align: center; background: var(--deep); color: var(--ivory); border-radius: 18px; padding: 36px 28px; }
    svg { width: 64px; height: 64px; }
    h1 { font-family: Georgia, serif; font-weight: 500; margin: 14px 0 8px; }
    p { color: rgba(244, 247, 242, .78); line-height: 1.6; margin: 0 0 20px; }
    button { border: 0; border-radius: 8px; background: var(--mint); color: var(--deep); font-weight: 700; padding: 13px 22px; font-size: 14px; cursor: pointer; }
    .sos { margin-top: 18px; font-size: 13px; color: #F6D9CF; }
  </style>
</head>
<body>
  <div class="card">
    <svg viewBox="0 0 48 48" fill="none" stroke="#A8CFC3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M24 4.5 40 10v11.2c0 10.1-6.6 17.7-16 22.3C14.6 38.9 8 31.3 8 21.2V10L24 4.5Z" />
      <path d="M17.1 20.8c0-3.2 2.2-5.4 5-5.4 1.1 0 2.2.5 2.9 1.4.8-.9 1.9-1.4 3-1.4 2.7 0 4.9 2.2 4.9 5.4 0 4.2-5.2 8-7.9 10-2.7-2-7.9-5.8-7.9-10Z" />
    </svg>
    <h1>You’re offline</h1>
    <p>Sentinel needs an internet connection. Check your Wi-Fi or mobile data and try again.</p>
    <button onclick="location.reload()">Try again</button>
    <p class="sos">In an emergency, call your local emergency number.</p>
  </div>
</body>
</html>
