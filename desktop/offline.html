<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Offline · Sentinel Motherhood</title>
  <style>
    :root { --deep: #123F46; --mint: #A8CFC3; --ivory: #F4F7F2; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--ivory); font-family: system-ui, -apple-system, "Segoe UI", sans-serif; padding: 24px; }
    .card { max-width: 420px; text-align: center; background: var(--deep); color: var(--ivory); border-radius: 18px; padding: 36px 28px; }
    svg { width: 64px; height: 64px; }
    h1 { font-family: Georgia, serif; font-weight: 500; margin: 14px 0 8px; }
    p { color: rgba(244, 247, 242, .78); line-height: 1.6; margin: 0 0 20px; }
    a.button { display: inline-block; text-decoration: none; border-radius: 8px; background: var(--mint); color: var(--deep); font-weight: 700; padding: 13px 22px; font-size: 14px; }
    .sos { margin-top: 18px; font-size: 13px; color: #F6D9CF; }
  </style>
</head>
<body>
  <div class="card">
    <svg viewBox="0 0 48 48" fill="none" stroke="#A8CFC3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <g transform="translate(2 0.5)">
        <circle cx="19" cy="10.5" r="5" />
        <path d="M14 18.5C9.8 21 7.5 26 7.5 32.5V42" />
        <path d="M24 18.2c2.2.6 4 1.5 5.4 2.6" />
        <circle cx="32" cy="24.5" r="3.8" />
        <path d="M28.6 26.8c-3.2-.6-7.8.4-10.8 2.8-2 1.6-1.8 3.8.6 4.4 3.6.9 8.8-.6 11.6-3.2" />
        <path d="M10.5 29.5c2.5 5.8 9 8.8 16.2 7.6 4.6-.8 8.2-3.6 9.8-7.4" />
      </g>
    </svg>
    <h1>You’re offline</h1>
    <p>Sentinel needs an internet connection. Check your Wi-Fi and try again.</p>
    <a class="button" href="https://sentinel-motherhood.vercel.app/app">Try again</a>
    <p class="sos">In an emergency, call your local emergency number.</p>
  </div>
</body>
</html>
