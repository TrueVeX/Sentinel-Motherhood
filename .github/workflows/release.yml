name: Build desktop apps

# Builds the Windows, macOS and Linux apps and attaches them to a GitHub Release.
# Runs when a version tag like v1.2.0 is pushed, or by hand from the Actions tab.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build and publish (for example v1.1.0)"
        required: true

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - name: Build app
        run: npx electron-builder --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: app-${{ matrix.os }}
          if-no-files-found: error
          path: |
            desktop/dist/*.exe
            desktop/dist/*.dmg
            desktop/dist/*.AppImage
            desktop/dist/*.deb

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: files
          merge-multiple: true
      - run: ls -la files
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: Sentinel Motherhood ${{ github.event.inputs.tag || github.ref_name }}
          files: files/*
          fail_on_unmatched_files: true
          body: |
            **Download page:** https://sentinel-motherhood-download.vercel.app

            | Device | File |
            | --- | --- |
            | Android | `Sentinel-Motherhood.apk` |
            | Windows 10/11 | `Sentinel-Motherhood-Windows-Setup.exe` |
            | macOS (Apple Silicon & Intel) | `Sentinel-Motherhood-macOS.dmg` |
            | Linux | `Sentinel-Motherhood-Linux.AppImage` or `.deb` |
            | iPhone / iPad | Open https://sentinel-motherhood.vercel.app/app in Safari → Share → Add to Home Screen |

            The apps aren't code-signed yet, so Windows and macOS show a warning the first time; the download page explains how to open them.

            Made By Revoori Krithika Reddy.
